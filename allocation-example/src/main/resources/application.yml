# Everything the engine needs is these two directories. No workers, no queue size, no limits: every
# remaining property has a default that is correct for a single-process deployment (docs/API.md §5).
allocation:
  working-directory: ./target/example-work
  rules-directory: ./data/rules

server:
  port: 8080

# The metrics endpoint, so `curl localhost:8080/actuator/metrics/allocation.run.finished` works. The run
# meters themselves need no configuration: they appear because actuator provides a MeterRegistry.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    io.allocation: INFO
